<script id="icnsl-calm-enhancement">
/* Progressive presentation enhancement; unmatched records keep their original markup. */
document.documentElement.setAttribute('data-icnsl-design', 'calm');
document.addEventListener('DOMContentLoaded', function () {
  'use strict';
  const root = document.querySelector('.icnsl-showcase');
  if (!root || root.dataset.calmEnhanced) return;
  root.dataset.calmEnhanced = 'true';
  const element = (tag, className, text) => {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  };
  const rich = (tag, className, html) => {
    const node = element(tag, className);
    // Only reuse markup already supplied by the site's own static page.
    node.innerHTML = html;
    return node;
  };
  const pageTitles = {people: 'People', publications: 'Publications', patents: 'Patents', experiences: 'Experiences', lecture: 'Lecture', contact: 'Contact'};
  const intro = root.querySelector('.icnsl-showcase__intro-copy');
  Object.keys(pageTitles).forEach(key => {
    if (root.classList.contains('icnsl-showcase--' + key) && intro) {
      const title = element('h1', 'calm-page-title', pageTitles[key]);
      intro.insertBefore(title, intro.querySelector('.icnsl-showcase__lead'));
    }
  });
  const menu = document.querySelector('.greedy-nav > button');
  if (menu) {
    menu.setAttribute('aria-label', 'More navigation links');
    const hiddenMenu = document.querySelector('.greedy-nav .hidden-links');
    if (hiddenMenu) {
      hiddenMenu.id = 'more-navigation-links';
      menu.setAttribute('aria-controls', hiddenMenu.id);
      const updateExpanded = () => menu.setAttribute('aria-expanded', String(!hiddenMenu.classList.contains('hidden')));
      new MutationObserver(updateExpanded).observe(hiddenMenu, {attributes: true, attributeFilter: ['class']});
      updateExpanded();
    }
  }
  const themeButton = document.querySelector('#theme-toggle a');
  if (themeButton) {
    themeButton.removeAttribute('aria-labelledby');
    themeButton.setAttribute('aria-label', 'Toggle light and dark theme');
    themeButton.setAttribute('tabindex', '0');
    themeButton.addEventListener('keydown', event => {
      if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); themeButton.click(); }
    });
  }
  if (root.classList.contains('icnsl-showcase--home')) {
    const research = root.querySelector('.home-section--research');
    const news = root.querySelector('.home-section--news');
    if (research && news) root.insertBefore(research, news);
    const eyebrow = root.querySelector('.icnsl-showcase__eyebrow');
    if (eyebrow) eyebrow.textContent = 'ICNSL · Sejong University';
    [['home-notice-heading', 'Notice', ''], ['home-research-heading', 'Research Areas', '01'], ['home-news-heading', 'Recent News', '02']].forEach(([id, title, no]) => {
      const heading = document.getElementById(id);
      if (heading) { heading.textContent = title; if (no) heading.prepend(element('span', 'calm-section-no', no)); }
    });
    const drawings = [
      '<path d="M10 41L28 8L46 41Z"/><circle cx="10" cy="41" r="4"/><circle cx="28" cy="8" r="4"/><circle cx="46" cy="41" r="4"/>',
      '<path d="M16 28H40" stroke-dasharray="3 4"/><circle cx="10" cy="28" r="7"/><circle cx="46" cy="28" r="7"/>',
      '<path d="M28 28V7M28 28L8 18M28 28L8 43M28 28L48 18M28 28L48 43"/><circle cx="28" cy="28" r="5"/><circle cx="28" cy="7" r="4"/><circle cx="8" cy="18" r="4"/><circle cx="8" cy="43" r="4"/><circle cx="48" cy="18" r="4"/><circle cx="48" cy="43" r="4"/>',
      '<path d="M11 12H45V44H11Z" stroke-dasharray="3 4"/><path d="M11 12L45 44M45 12L11 44"/><circle cx="11" cy="12" r="4"/><circle cx="45" cy="12" r="4"/><circle cx="11" cy="44" r="4"/><circle cx="45" cy="44" r="4"/>'
    ];
    root.querySelectorAll('.research-card').forEach((card, i) => {
      const icon = element('div', 'calm-research-icon');
      icon.setAttribute('aria-hidden', 'true');
      icon.innerHTML = '<svg viewBox="0 0 56 56" fill="none" stroke="currentColor" stroke-width="1.6" xmlns="http://www.w3.org/2000/svg">' + drawings[i % drawings.length] + '</svg>';
      card.prepend(icon);
    });
    root.querySelectorAll('.home-section--news .home-section__entry').forEach(entry => {
      const date = entry.querySelector('.home-section__text > strong');
      if (!date || !/^\[\d{4}\.\d{2}\]$/.test(date.textContent.trim())) return;
      const value = date.textContent.trim().slice(1, -1);
      const time = element('time', 'calm-news-date', value);
      time.dateTime = value.replace('.', '-');
      date.remove();
      entry.prepend(time);
    });
  }
  if (root.classList.contains('icnsl-showcase--patents')) {
    const tags = root.querySelector('.icnsl-showcase__tags');
    if (tags) {
      const items = [...tags.children].map(node => node.textContent.match(/^(.*?)\s*·\s*(\d+)\s+granted$/));
      if (items.length === 3 && items.every(Boolean)) {
        const stats = element('dl', 'patent-stats');
        stats.setAttribute('aria-label', 'Granted patent counts');
        items.forEach(match => {
          const stat = element('div', 'patent-stat');
          stat.append(element('dt', '', match[1] === 'Total' ? 'Total granted' : match[1]), element('dd', '', match[2]));
          stats.append(stat);
        });
        tags.replaceWith(stats);
      }
    }
    const nav = element('nav', 'calm-section-nav');
    nav.setAttribute('aria-label', 'Patent jurisdictions');
    [['us-patents-heading', 'United States'], ['kr-patents-heading', 'Republic of Korea']].forEach(([id, label]) => {
      const link = element('a', '', label); link.href = '#' + id; nav.append(link);
    });
    if (intro) intro.append(nav);
    root.querySelectorAll('.pub-citation').forEach(citation => {
      const patentLink = citation.querySelector('a.patent-link');
      if (!patentLink) return;
      const html = citation.innerHTML;
      const pos = html.indexOf(patentLink.outerHTML);
      if (pos < 0) return;
      const tail = html.slice(pos + patentLink.outerHTML.length);
      const match = tail.match(/^,\s*“?([\s\S]*?)(?:,”|”,)\s*([\s\S]*?),\s*(\d{4}\.\d{2}\.\d{2}\.)\s*$/);
      if (!match) return;
      const title = rich('h3', 'pub-title', match[1]);
      const authors = rich('div', 'pub-authors', match[2]);
      const meta = element('div', 'pub-meta patent-meta');
      const date = element('time', '', match[3]); date.dateTime = match[3].slice(0, -1).replace(/\./g, '-');
      const full = element('a', 'patent-full-text', 'Full text ↗');
      full.href = patentLink.href; full.target = '_blank'; full.rel = 'noopener noreferrer';
      full.setAttribute('aria-label', 'Read full text of ' + patentLink.textContent);
      const badge = html.slice(0, pos).trim();
      const originalLink = patentLink.cloneNode(true);
      meta.append(originalLink, date, full);
      citation.replaceChildren();
      if (badge) citation.append(rich('div', 'patent-standard', badge));
      citation.append(title, authors, meta);
    });
  }
  if (root.classList.contains('icnsl-showcase--publications')) {
    root.querySelectorAll('.pub-citation').forEach(citation => {
      const match = citation.innerHTML.trim().match(/^([\s\S]*?),\s*“([\s\S]*?)(?:,”|”,)\s*<br\s*\/?>([\s\S]*)$/);
      if (!match) return;
      citation.replaceChildren(rich('h3', 'pub-title', match[2]), rich('div', 'pub-authors', match[1]), rich('div', 'pub-meta', match[3]));
    });
  }
});
