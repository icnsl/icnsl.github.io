      <path d="M0 0L10 5L0 10Z" fill="#5b8cff"/>
    </marker>
    <marker id="pinkArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#ff7b8d"/>
    </marker>
  </defs>

