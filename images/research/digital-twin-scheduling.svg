      <stop offset="0" stop-color="#07131f"/>
      <stop offset="1" stop-color="#172944"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="15" flood-color="#000" flood-opacity=".34"/>
    </filter>
