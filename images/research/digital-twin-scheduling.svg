<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Digital twin scheduling and synchronization</title>
  <desc id="desc">A scheduler coordinates update and inference tasks between physical assets and cyber twins while tracking freshness.</desc>
  <defs>
